<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Plenty Heaps</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    /* touch-action: none stops the browser scrolling or zooming during play */
    #game { width: 100%; height: 100%; touch-action: none; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    /* The message when a saved farm can't be loaded (src/ui/saveProblem.js) */
    #save-problem { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center;
      justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.6); font: 16px/1.4 sans-serif; }
    #save-problem > div { max-width: 26rem; padding: 16px 20px; border: 3px solid #e8c170;
      border-radius: 6px; background: #3b2a1e; color: #fff6e0; }
    #save-problem h2 { margin: 0 0 8px; font-size: 20px; }
    #save-problem .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    #save-problem button { padding: 10px 14px; font: inherit; border: 2px solid #e8c170;
      border-radius: 4px; background: #5a4130; color: inherit; cursor: pointer; }
    #save-problem button.primary { background: #3a683d; }
  </style>
</head>
<body>
  <div id="game"></div>

  <!--
    LOAD ORDER MATTERS. Each file adds itself to the global FarmSim object.
    When you add a code file, add a <script> tag here. (Maps are all in
    src/data/maps.js, which the map maker builds.)
  -->

  <!-- EduGame Kit's save helper. edugame-config.js and edugame.js are made by
       "edugame build" / "edugame preview"; keep these two lines. -->
  <script src="edugame-config.js"></script>
  <script src="edugame.js"></script>

  <!-- Engine: Phaser 3.90.0 -->
  <script src="lib/phaser.min.js"></script>

  <!-- Setup -->
  <script src="src/namespace.js"></script>
  <script src="src/config.js"></script>

  <!-- Core helpers (no Phaser needed) -->
  <script src="src/core/bitpack.js"></script>
  <script src="src/core/rng.js"></script>
  <script src="src/core/calendar.js"></script>

  <!-- Game data -->
  <script src="src/data/registry.js"></script>
  <script src="src/data/tiles.js"></script>
  <script src="src/data/crops.js"></script>
  <script src="src/data/items.js"></script>
  <script src="src/data/npcs.js"></script>
  <script src="src/data/flags.js"></script>
  <script src="src/data/currencies.js"></script>
  <script src="src/data/appearance.js"></script>
  <!-- Every map and the list of areas (built by the map maker: tools/map_maker.py) -->
  <script src="src/data/maps.js"></script>
  <script src="src/data/areas.js"></script>
  <script src="src/data/strings.js"></script>

  <!-- Game rules and saving (no Phaser needed) -->
  <script src="src/core/weather.js"></script>
  <script src="src/core/sky.js"></script>
  <script src="src/core/mapView.js"></script>
  <script src="src/core/gameState.js"></script>
  <script src="src/core/farming.js"></script>
  <script src="src/core/day.js"></script>
  <script src="src/core/saveCodec.js"></script>
  <script src="src/core/storage.js"></script>
  <script src="src/core/session.js"></script>
  <script src="src/core/charRecolor.js"></script>
  <script src="src/ui/saveProblem.js"></script>

  <!-- Phaser scenes and the art helpers they use -->
  <script src="src/scenes/UIArt.js"></script>
  <script src="src/scenes/TileArt.js"></script>
  <script src="src/scenes/CharacterArt.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/CreateScene.js"></script>
  <script src="src/scenes/WorldScene.js"></script>
  <script src="src/scenes/UIScene.js"></script>

  <!-- Start -->
  <script src="src/main.js"></script>
</body>
</html>
