# Publishes this game to GitHub Pages: a front page, and the game to play in the browser.
# Made by "edugame new --github". The steps are EduGame Kit's (its game-pages.yml workflow), at
# the kit release named after "@", which Dependabot keeps up to date (see build.yml).
#
# One-time setup (see EduGame Kit's docs/platforms/GITHUB_PAGES.md):
#   1. Settings > Pages > Source: GitHub Actions.
#   2. To count visits with GoatCounter: Settings > Secrets and variables > Actions >
#      Variables > New repository variable: GOATCOUNTER_CODE = your GoatCounter code.
#      Leave it out and nothing is counted. The counting is only added to this site,
#      never to the game's zips.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    name: Pages
    uses: togetherings/edugame-kit/.github/workflows/game-pages.yml@v0.3.0
